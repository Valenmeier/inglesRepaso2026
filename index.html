lot-title{color:#8b88a3;text-transform:uppercase;letter-spacing:.5px;font-weight:800;font-size:10px;margin-bottom:5px}.slot input{min-width:0;width:100%;padding:8px 9px;border:1px solid #dcd9e9;border-radius:9px;background:#fff;font-size:15px;font-weight:750;color:var(--ink)}.slot .value{display:block;font-size:18px;font-weight:850;overflow-wrap:anywhere;min-height:36px;padding-top:5px}.slot .hidden-val{font-size:16px;color:#b6afce;letter-spacing:2px}.slot.is-answer{border-color:#b1dcc8;background:#effbf4}.listen-btn{background:#fff;border:1px solid #ded9f6;color:#5d4ac5;border-radius:11px;padding:7px 10px;font-weight:700;font-size:12px;white-space:nowrap}.right-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.btn{border:0;background:var(--purple);color:#fff;border-radius:13px;padding:13px 20px;font-weight:800;box-shadow:0 4px 0 var(--deep);transition:transform .1s,box-shadow .1s}.btn:hover:not(:disabled){filter:brightness(1.07)}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}.btn.secondary{color:#6656bd;background:#f0edff;box-shadow:none;border:1px solid #d9d2fa}.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:#6e6b8a;font-size:12px;padding:9px 12px}.feedback{margin-top:18px;border-radius:15px;padding:15px 17px;display:none;border:1px solid transparent}.feedback.show{display:block}.feedback.good{background:#edfbf3;border-color:#b8e9cc;color:#205e3f}.feedback.bad{background:#fff0f2;border-color:#f2cad3;color:#9e3850}.feedback strong{display:block;font-size:15px}.feedback p{margin:5px 0;font-size:13px}.feedback .answer-key{font-weight:850;color:var(--ink)}.feedback .memory{margin-top:9px;padding-top:9px;border-top:1px solid #0001;font-size:12px}.side-stack{display:grid;gap:15px}.aside{border:1px solid var(--line);border-radius:20px;background:#fff;padding:19px;box-shadow:var(--shadow)}.aside h3{font-size:16px;letter-spacing:-.25px;marg #dcd9eb;border-radius:12px}.table-wrap{overflow:auto;max-height:500px;border:1px solid var(--line);border-radius:12px}.verb-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;min-width:530px}.verb-table th{position:sticky;top:0;background:#eeebff;color:#574ca7;padding:11px 12px;z-index:1}.verb-table td{padding:9px 12px;border-top:1px solid #eeeef5}.verb-table tr:nth-child(even){background:#fbfaff}.footnote{font-size:12px;color:#8885a0;margin-top:15px}.reset-link{border:0;color:#938ca9;background:transparent;text-decoration:underline;font-size:11px;padding:7px 0}.empty{padding:22px;text-align:center;color:#77748c;font-size:13px;border:1px dashed #d9d5e9;border-radius:15px;background:#fbfaff}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);background:#2e2b51;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:0 10px 30px #2224;opacity:0;pointer-events:none;transition:.2s;z-index:5;font-size:13px;max-width:85vw;text-align:center}.toast.visible{opacity:1;transform:translate(-50%,0)}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:25px;font-size:12px;color:#8c89a3}.keycap{display:inline-block;border:1px solid #dcd8ec;background:#fff;border-radius:5px;padding:1px 5px;font-size:11px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:630px){.shell{padding:18px 13px 45px}.top{align-items:flex-start}.header-note{display:none}.stats{gap:8px;margin-top:22px}.stat{padding:11px;gap:8px;border-radius:15px}.stat strong{font-size:17px}.stat small{font-size:10px;white-space:normal}.stat-icon{height:33px;width:33px;border-radius:10px;font-size:16px}.tabs{gap:3px}.tab{font-size:12px;padding:11px 9px}.panel{padding:17px;border-radius:19px}.panel-heading h2{font-size:23px}.controls{grid-template-columns:1fr}.question{padding:14px}.prompt-title{font-size:27px}.conjugation{gap:5px}.slot{padding:7px 5px}.slot .value{font-size:14px}.slot input{font-size:13px;padding:7px 5px}.slot-title{font-size:9px;letter-spacing:0}.side-stack,.lesson-grid{grid-template-columns:1fr}.footer{flex-direction:column;align-items:flex-start}.right-actions .btn{flex:1}.flag{font-size:10px}}

<div class="shell">
<header class="top"><div class="brand"><div class="brandmark" aria-hidden="true">↗</div><div><h1>English Sprint<span style="color:var(--purple)">.</span></h1><p>Practicá un poquito. Aprendé un montón.</p></div></div><div class="header-note">⏱ Sesiones de 5 minutos · sin presión</div></header>

<script>
'use strict';
// Las 70 entradas siguen las dos columnas de la página 164 facilitada por el usuario.
const RAW_VERBS=`be|was/were|been|ser / estar
become|became|become|convertirse en
blow|blew|blown|soplar
break|broke|broken|romper
bring|brought|brought|traer
build|built|built|construir
buy|bought|bought|comprar
catch|caught|caught|atrapar
choose|chose|chosen|elegir
come|came|come|venir
cost|cost|cost|costar
cut|cut|cut|cortar
deal|dealt|dealt|tratar / negociar
do|did|done|hacer
draw|drew|drawn|dibujar
drink|drank|drunk|beber
drive|drove|driven|conducir
eat|ate|eaten|comer

feel|felt|felt|sentir
find|found|found|encontrar
fly|flew|flown|volar
forget|forgot|forgotten|olvidar
get|got|got|conseguir / obtener
give|gave|given|dar
go|went|gone|ir
grow|grew|grown|crecer
have|had|had|tener
hear|heard|heard|oír
hide|hid|hidden|esconder
hit|hit|hit|golpear
hold|held|held|sostener
keep|kept|kept|mantener / guardar
know|knew|known|saber / conocer
lead|led|led|liderar / guiar
learn|learned/learnt|learned/learnt|aprender
leave|left|left|irse / dejar
lend|lent|lent|prestar
let|let|let|dejar / permitir
lose|lost|lost|perder
make|made|made|hacer / fabricar
meet|met|met|conocer / reunirse con
pay|paid|paid|pagar
put|put|put|poner
read|read|read|leer
ride|rode|ridden|montar / andar en
ring|rang|rung|sonar / llamar
run|ran|run|correr
sink|sank|sunk|hundirse
say|said|said|decir
see|saw|seen|ver
sell|sold|sold|vender
set|set|set|colocar / establecer
sing|sang|sung|cantar
sleep|slept|slept|dormir
speak|spoke|spoken|hablar
spend|spent|spent|gastar / pasar tiempo
stand|stood|stood|estar de pie
steal|stole|stolen|robar
swim|swam|swum|nadar
take|took|taken|tomar / llevar
teach|taught|taught|enseñar
tell|told|told|contar / decir a alguien
think|thought|thought|pensar
throw|threw|thrown|lanzar
understand|understood|understood|entender
wake|woke|woken|despertar(se)
wear|wore|worn|llevar puesto
win|won|won|ganar
write|wrote|written|escribir`;
const verbs=RAW_VERBS.trim().split('\n').map(line=>{const [v1,v2,v3,es]=line.split('|');const pat=v1===v2&&v2===v3?'AAA':v1===v3?'ABA':v2===v3?'ABB':'ABC';return {v1,v2,v3,es,pat};});
// 1 oración estable por tiempo verbal, en afirmativa / negativa / interrogativa.
const tenses=[
{id:'ps',name:'Present Simple',group:'present',formula:'Sujeto + V1 (he/she/it: V+s)',tip:'Rutinas y hechos generales. En negativo y pregunta aparece do/does; el verbo vuelve a V1.',marker:'every day · usually · always',forms:['She studies English every day.','She doesn’t study English every day.','Does she study English every day?'],es:['Ella estudia inglés todos los días.','Ella no estudia inglés todos los días.','¿Ella estudia inglés todos los días?'],clues:['studies: con she, el verbo lleva -s.','doesn’t + study: does se lleva la -s.','Does + she + study: auxiliar primero y verbo base.']},
{id:'pc',name:'Present Continuous',group:'present',formula:'am/is/are + verbo-ing',tip:'Acciones en progreso ahora o situaciones temporales. El auxiliar be cambia de lugar en las preguntas.',marker:'now · right now · at the moment',forms:['She is studying English now.','She isn’t studying English now.','Is she studying English now?'],es:['Ella está estudiando inglés ahora.','Ella no está estudiando inglés ahora.','¿Ella está estudiando inglés ahora?'],clues:['is + studying: be + -ing.','isn’t + studying: be negado + -ing.','Is + she + studying: inversión de be y sujeto.']},
{id:'pp',name:'Present Perfect',group:'present',formula:'have/has + V3 (participio)',tip:'Experiencias o resultados vinculados con el presente. Atención: has finished no es Past Simple.',marker:'already · yet · ever · since',forms:['She has finished her homework.','She hasn’t finished her homework.','Has she finished her homework?'],es:['Ella ha terminado su tarea.','Ella no ha terminado su tarea.','¿Ha terminado su tarea?'],clues:['has + finished (V3).','hasn’t + finished (V3).','Has + she + finished: pregunta con has.']},
{id:'ppc',name:'Present Perfect Continuous',group:'present',formula:'have/has + been + verbo-ing',tip:'Destaca la duración de una actividad iniciada antes y conectada con el presente.',marker:'for · since · all morning',forms:['She has been studying for two hours.','She hasn’t been studying for two hours.','Has she been studying for two hours?'],es:['Ella lleva dos horas estudiando.','Ella no lleva dos horas estudiando.','¿Lleva dos horas estudiando?'],clues:['has been + studying: tres piezas.','hasn’t been + studying: has negado, been + -ing.','Has + she + been + studying.']},
{id:'pas',name:'Past Simple',group:'past',formula:'V2; en negativo/pregunta: did + V1',tip:'Acción terminada en un momento pasado. DID obliga a volver al verbo base.',marker:'yesterday · last year · ago',forms:['She studied English yesterday.','She didn’t study English yesterday.','Did she study English yesterday?'],es:['Ella estudió inglés ayer.','Ella no estudió inglés ayer.','¿Estudió inglés ayer?'],clues:['studied: pasado terminado, con yesterday.','didn’t + study: no se dice didn’t studied.','Did + she + study: el pasado está en did.']},
{id:'pac',name:'Past Continuous',group:'past',formula:'was/were + verbo-ing',tip:'Acción que estaba en desarrollo en un momento del pasado.',marker:'at 8 p.m. yesterday · while',forms:['She was studying at 8 p.m.','She wasn’t studying at 8 p.m.','Was she studying at 8 p.m.?'],es:['Ella estaba estudiando a las ocho de la noche.','Ella no estaba estudiando a las ocho de la noche.','¿Estaba estudiando a las ocho de la noche?'],clues:['was + studying: acción en progreso en el pasado.','wasn’t + studying.','Was + she + studying: was pasa delante.']},
{id:'pap',name:'Past Perfect',group:'past',formula:'had + V3 (participio)',tip:'Algo ya había ocurrido antes de otro momento del pasado. HAD es la pista principal.',marker:'before · by the time · already',forms:['She had finished before dinner.','She hadn’t finished before dinner.','Had she finished before dinner?'],es:['Ella había terminado antes de cenar.','Ella no había terminado antes de cenar.','¿Había terminado antes de cenar?'],clues:['had + finished (V3): había terminado.','hadn’t + finished (V3).','Had + she + finished: had invertido.']},
{id:'papc',name:'Past Perfect Continuous',group:'past',formula:'had + been + verbo-ing',tip:'Cuánto tiempo llevaba ocurriendo algo antes de otro punto pasado.',marker:'for two hours before · until then',forms:['She had been studying for two hours before dinner.','She hadn’t been studying for two hours before dinner.','Had she been studying for two hours before dinner?'],es:['Ella llevaba dos horas estudiando antes de cenar.','Ella no llevaba dos horas estudiando antes de cenar.','¿Llevaba dos horas estudiando antes de cenar?'],clues:['had been + studying: duración antes del pasado.','hadn’t been + studying.','Had + she + been + studying.']},
{id:'fw',name:'Future Simple (will)',group:'future',formula:'will + V1',tip:'Predicciones, promesas y decisiones espontáneas. Después de WILL va el verbo base.',marker:'tomorrow · I think · probably',forms:['She will study tomorrow.','She won’t study tomorrow.','Will she study tomorrow?'],es:['Ella estudiará mañana.','Ella no estudiará mañana.','¿Estudiará mañana?'],clues:['will + study (V1).','won’t + study (V1).','Will + she + study: will pasa primero.']},
{id:'fg',name:'Future (going to)',group:'future',formula:'am/is/are + going to + V1',tip:'Planes e intenciones, o predicciones con evidencia. No confundir con will.',marker:'tonight · next week · look!',forms:['She is going to study tonight.','She isn’t going to study tonight.','Is she going to study tonight?'],es:['Ella va a estudiar esta noche.','Ella no va a estudiar esta noche.','¿Va a estudiar esta noche?'],clues:['is + going to + study.','isn’t + going to + study.','Is + she + going to + study.']},
{id:'fc',name:'Future Continuous',group:'future',formula:'will + be + verbo-ing',tip:'Acción que estará desarrollándose en un momento futuro.',marker:'at this time tomorrow · at 8 p.m.',forms:['She will be studying at 8 p.m. tomorrow.','She won’t be studying at 8 p.m. tomorrow.','Will she be studying at 8 p.m. tomorrow?'],es:['Ella estará estudiando mañana a las ocho de la noche.','Ella no estará estudiando mañana a las ocho de la noche.','¿Estará estudiando mañana a las ocho de la noche?'],clues:['will be + studying (no will studying).','won’t be + studying.','Will + she + be + studying.']},
{id:'fp',name:'Future Perfect',group:'future',formula:'will + have + V3',tip:'Algo estará terminado antes de un momento del futuro. BY suele ser una pista.',marker:'by Friday · by then · by 2030',forms:['She will have finished by Friday.','She won’t have finished by Friday.','Will she have finished by Friday?'],es:['Ella habrá terminado para el viernes.','Ella no habrá terminado para el viernes.','¿Habrá terminado para el viernes?'],clues:['will have + finished (V3).','won’t have + finished (V3).','Will + she + have + finished.']},
{id:'fpc',name:'Future Perfect Continuous',group:'future',formula:'will + have + been + verbo-ing',tip:'Cuánto tiempo llevará durando una acción al llegar a un punto futuro.',marker:'by 8 p.m. · for two hours by then',forms:['She will have been studying for two hours by 8 p.m.','She won’t have been studying for two hours by 8 p.m.','Will she have been studying for two hours by 8 p.m.?'],es:['Para las ocho, ella llevará dos horas estudiando.','Para las ocho, ella no llevará dos horas estudiando.','¿Para las ocho llevará dos horas estudiando?'],clues:['will have been + studying: duración acumulada en el futuro.','won’t have been + studying.','Will + she + have been + studying.']}
];
const forms=['Afirmativa (+)','Negativa (−)','Interrogativa (?)'];
const grammarCards=tenses.flatMap(t=>t.forms.map((sentence,i)=>({id:`${t.id}_${i}`,tense:t,i,sentence,es:t.es[i]})));
const STORE='english-sprint-v1';
const initial={xp:0,answered:0,correct:0,masteredVerbs:[],masteredGrammar:[],wrongVerbs:[],wrongGrammar:[],days:{}};
let progress;
try{progress={...initial,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){progress={...initial}};
for(const k of ['masteredVerbs','masteredGrammar','wrongVerbs','wrongGrammar'])if(!Array.isArray(progress[k]))progress[k]=[];
if(!progress.days||typeof progress.days!=='object')progress.days={};
let tab='verbs',verbMode='double',verbFilter='all',grammarFilter='all',grammarFormFilter='all',libraryType='verbs',libraryQuery='';
let currentVerb=verbs[0],currentCard=grammarCards[0],singleSlot=1,verbFeedback=null,grammarFeedback=null;
function persist(){try{localStorage.setItem(STORE,JSON.stringify(progress))}catch(e){}}
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayGood(){return progress.days[dayKey()]||0}
function streak(){let d=new Date(),run=0;if(!progress.days[dayKey(d)])d.setDate(d.getDate()-1);while(progress.days[dayKey(d)]){run++;d.setDate(d.getDate()-1)}return run}
function record(kind,id,passed){progress.answered++;if(passed){progress.correct++;progress.xp+=(kind==='verb'?10:12);progress.days[dayKey()]=(progress.days[dayKey()]||0)+1;const good=kind==='verb'?'masteredVerbs':'masteredGrammar',bad=kind==='verb'?'wrongVerbs':'wrongGrammar';if(!progress[good].includes(id))progress[good].push(id);progress[bad]=progress[bad].filter(x=>x!==id)}else{const bad=kind==='verb'?'wrongVerbs':'wrongGrammar';if(!progress[bad].includes(id))progress[bad].push(id)}persist();renderStats()}
function renderStats(){document.querySelector('#xpStat').textContent=`${progress.xp} XP`;document.querySelector('#levelText').textContent=`Nivel ${Math.floor(progress.xp/100)+1}`;document.querySelector('#streakStat').textContent=`${streak()} ${streak()===1?'día':'días'}`;document.querySelector('#dailyStat').textContent=`${todayGood()} / 10`;document.querySelector('#dailyBar').style.width=`${Math.min(100,todayGood()*10)}%`;document.querySelector('#masteryStat').textContent=`${progress.masteredVerbs.length+progress.masteredGrammar.length} / ${verbs.length+grammarCards.length}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function poolVerbs(){return verbs.filter(v=>verbFilter==='all'||verbFilter===v.pat||(verbFilter==='errors'&&progress.wrongVerbs.includes(v.v1)))}
function poolGrammar(){return grammarCards.filter(c=>(grammarFilter==='all'||c.tense.group===grammarFilter||(grammarFilter==='errors'&&progress.wrongGrammar.includes(c.id)))&&(grammarFormFilter==='all'||c.i===Number(grammarFormFilter)))}
function randomOther(pool,current){if(!pool.length)return null;const a=pool.filter(x=>x!==current);return (a.length?a:pool)[Math.floor(Math.random()*(a.length?a.length:pool.length))]}
function pickVerb(){currentVerb=randomOther(poolVerbs(),currentVerb)||null;singleSlot=Math.floor(Math.random()*3);verbFeedback=null;render()}
function pickGrammar(){currentCard=randomOther(poolGrammar(),currentCard)||null;grammarFeedback=null;render()}
function pillStatus(){return `<span class="flag">${progress.xp} XP acumulados</span>`}
function shell(title,sub,inner,aside){return `<div class="layout"><section class="panel"><div class="panel-heading"><div><span class="eyebrow">${sub}</span><h2>${title}</h2></div>${pillStatus()}</div>${inner}</section><aside class="side-stack">${aside}</aside></div>`}
function commonAside(){return `<div class="aside tip"><div class="meta">MINI-REGLA</div><h3>V1 · V2 · V3</h3><p><b>V1</b> = infinitivo/base: <i>go</i>.<br><b>V2</b> = pasado simple: <i>went</i>.<br><b>V3</b> = participio: <i>gone</i>.</p><p style="margin-top:9px">Para tiempos perfectos usamos <b>have / has / had + V3</b>.</p></div><div class="aside"><h3>Practicá sin agotarte</h3><p>Con 5–10 respuestas diarias ya entrenás reconocimiento. No hay vidas: equivocarte sólo manda esa forma a <b>Mis errores</b>.</p></div><div class="aside"><h3>Recordatorios del libro</h3><ul class="small-list"><li><code>cut – cut – cut</code>: las tres formas son iguales.</li><li><code>read – read – read</code>: se escribe igual, cambia la pronunciación en pasado.</li><li><code>go – went – gone</code>: las tres cambian.</li></ul></div>`}
function patternName(x){return {AAA:'AAA · las 3 iguales',ABA:'ABA · V1 = V3',ABB:'ABB · V2 = V3',ABC:'ABC · las 3 distintas'}[x]||x}
function verbSlots(){const v=currentVerb,arr=[v.v1,v.v2,v.v3];const names=['Infinitive · V1','Past Simple · V2','Past Participle · V3'];return arr.map((value,i)=>{const hidden=verbMode==='full'||(verbMode==='double'&&i!==0)||(verbMode==='single'&&i===singleSlot);return `<div class="slot ${verbFeedback&&hidden?'is-answer':''}"><div class="slot-title">${names[i]}</div>${hidden?`<input ${verbFeedback?'disabled':''} data-slot="${i}" aria-label="${names[i]}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribí..." value="${verbFeedback?esc(verbFeedback.values[i]||''):''}">`:`<span class="value">${esc(value)}</span>`}</div>`}).join('')}
function verbHint(v){let base={AAA:'Las tres columnas coinciden. Acá la dificultad es recordar que el verbo NO cambia.',ABA:'La V1 y la V3 son iguales; sólo cambia la V2.',ABB:'El pasado simple y el participio son idénticos; memorizalos como pareja.',ABC:'Tres formas distintas: pensalo como una secuencia de 3 pasos.'}[v.pat];if(v.v1==='read')base+=' Atención a la pronunciación: V1 “reed”, V2/V3 “red”.';if(v.v1==='be')base+=' En pasado usás WAS o WERE según el sujeto.';if(v.v1==='learn')base+=' LEARNED y LEARNT son válidas.';if(v.v1==='get')base+=' El libro usa GOT en V3; en inglés estadounidense también existe GOTTEN para ciertos usos.';return base}
function verbPage(){const pool=poolVerbs();if(!pool.includes(currentVerb))currentVerb=pool[0]||null;let inner=`<p class="desc">Los <b>${verbs.length} verbos</b> de tu foto, con significado en español. Practicás las tres columnas y recibís explicación al corregir.</p><div class="controls"><div class="control"><label class="label" for="verbMode">Tipo de desafío</label><select id="verbMode"><option value="double" ${verbMode==='double'?'selected':''}>V1 → completar V2 y V3</option><option value="single" ${verbMode==='single'?'selected':''}>Una columna oculta (V1, V2 o V3)</option><option value="full" ${verbMode==='full'?'selected':''}>Experto: las 3 desde español</option></select></div><div class="control"><label class="label" for="verbFilter">Elegir qué practicar</label><select id="verbFilter"><option value="all" ${verbFilter==='all'?'selected':''}>Todos (${verbs.length})</option><option value="AAA" ${verbFilter==='AAA'?'selected':''}>Patrón AAA</option><option value="ABB" ${verbFilter==='ABB'?'selected':''}>Patrón ABB</option><option value="ABA" ${verbFilter==='ABA'?'selected':''}>Patrón ABA</option><option value="ABC" ${verbFilter==='ABC'?'selected':''}>Patrón ABC</option><option value="errors" ${verbFilter==='errors'?'selected':''}>Mis errores (${progress.wrongVerbs.length})</option></select></div></div>`;
if(!currentVerb){inner+=`<div class="empty">Todavía no hay verbos en este filtro. Podés cambiarlo o practicar todos.<br><button class="btn secondary" style="margin-top:15px" data-action="all-verbs">Ver todos los verbos</button></div>`;return shell('Verbos irregulares','SESIÓN 01',inner,commonAside())}
const v=currentVerb;
inner+=`<div class="question"><div style="display:flex;justify-content:space-between;gap:9px;align-items:center"><span class="tiny-overline">${verbMode==='full'?'Traducí y conjugá':verbMode==='single'?'Completá la columna oculta':'Recordá pasado y participio'}</span><button class="listen-btn" type="button" data-action="say-verb" aria-label="Escuchar el verbo en inglés">🔊 Escuchar</button></div><div class="prompt-title">${verbMode==='full'?esc(v.es):esc(v.v1)}</div><p class="translation">${verbMode==='full'?'Escribí la forma inglesa y sus dos tiempos':`Significado: ${esc(v.es)}`}</p><form id="verbForm"><div class="conjugation">${verbSlots()}</div><div class="mode-line"><span>Patrón ${esc(v.pat)}</span><span>${progress.masteredVerbs.includes(v.v1)?'✓ Ya acertaste este verbo':'Cada acierto suma +10 XP'}</span></div><div class="right-actions">${verbFeedback?'<button class="btn" type="button" data-action="next-verb">Siguiente verbo →</button>':`<button class="btn" type="submit">Comprobar respuesta</button><button class="btn ghost" type="button" data-action="reveal-verb">Ver respuesta</button>`}</div></form></div>`;
if(verbFeedback){inner+=`<div class="feedback show ${verbFeedback.correct?'good':'bad'}" role="status"><strong>${verbFeedback.correct?'¡Muy bien! +10 XP':'Todavía no. Mirá la forma correcta:'}</strong><p class="answer-key">${esc(v.v1)} — ${esc(v.v2)} — ${esc(v.v3)}</p>${verbFeedback.correct?'<p>Acertaste las formas que faltaban.</p>':'<p>Este verbo quedó guardado en <b>Mis errores</b> para repasarlo.</p>'}<div class="memory"><b>Truco para recordar:</b> ${esc(verbHint(v))}</div></div>`}
return shell('Verbos irregulares','SESIÓN 01',inner,commonAside())}
function grammarAside(){return `<div class="aside tip"><div class="meta">TIPS PARA RECONOCER TIEMPOS</div><h3>Buscá el auxiliar</h3><ul class="small-list"><li><b>do / does</b> suele indicar Present Simple en negativas y preguntas.</li><li><b>did</b> indica Past Simple.</li><li><b>have / has + V3</b>: Present Perfect.</li><li><b>had + V3</b>: Past Perfect.</li><li><b>be + -ing</b>: Continuous.</li><li><b>will have + V3</b>: Future Perfect.</li></ul></div><div class="aside"><h3>39 frases, no 300</h3><p>Exactamente <b>una frase base por tiempo</b>, siempre en <b>+, − y ?</b>. Cambiamos el orden al practicar, pero nunca las oraciones.</p></div><div class="aside"><h3>Cuando corregís</h3><p>Siempre vas a ver la traducción, la fórmula que delata ese tiempo y una pista para reconocerlo.</p></div>`}
function grammarPage(){const pool=poolGrammar();if(!pool.includes(currentCard))currentCard=pool[0]||null;let inner=`<p class="desc">Identificá el tiempo de la oración. Son <b>13 estructuras</b> × <b>3 formas</b> (afirmativa, negativa y pregunta): sólo 39 ejemplos fijos.</p><div class="controls"><div class="control"><label class="label" for="grammarFilter">Qué tiempos practicar</label><select id="grammarFilter"><option value="all" ${grammarFilter==='all'?'selected':''}>Todos los tiempos</option><option value="present" ${grammarFilter==='present'?'selected':''}>Sólo presente</option><option value="past" ${grammarFilter==='past'?'selected':''}>Sólo pasado</option><option value="future" ${grammarFilter==='future'?'selected':''}>Sólo futuro</option><option value="errors" ${grammarFilter==='errors'?'selected':''}>Mis errores (${progress.wrongGrammar.length})</option></select></div><div class="control"><label class="label" for="grammarFormFilter">Tipo de oración</label><select id="grammarFormFilter"><option value="all" ${grammarFormFilter==='all'?'selected':''}>Mezclar + / − / ?</option><option value="0" ${grammarFormFilter==='0'?'selected':''}>Sólo afirmativas (+)</option><option value="1" ${grammarFormFilter==='1'?'selected':''}>Sólo negativas (−)</option><option value="2" ${grammarFormFilter==='2'?'selected':''}>Sólo preguntas (?)</option></select></div></div>`;
if(!currentCard){inner+=`<div class="empty">No hay preguntas en este filtro. Cambialo para seguir.<br><button class="btn secondary" style="margin-top:15px" data-action="all-grammar">Ver todos los tiempos</button></div>`;return shell('Detective de tiempos','SESIÓN 02',inner,grammarAside())}
const c=currentCard;
inner+=`<div class="question"><span class="tiny-overline">¿Qué tiempo verbal es?</span><div class="grammar-sentence">${esc(c.sentence)}</div><div class="form-pills"><span class="form-pill">Puede ser +, − o ?</span><span class="form-pill">Identificá el auxiliar y el verbo</span></div><form id="grammarForm" style="margin-top:19px"><label for="tenseAnswer" class="label">Elegí el tiempo verbal</label><select class="grammar-answer" id="tenseAnswer" ${grammarFeedback?'disabled':''}><option value="">Seleccioná una respuesta...</option>${[['present','PRESENTE'],['past','PASADO'],['future','FUTURO']].map(([id,label])=>`<optgroup label="${label}">${tenses.filter(t=>t.group===id).map(t=>`<option value="${t.id}" ${grammarFeedback&&grammarFeedback.guess===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('')}</select><div class="right-actions">${grammarFeedback?'<button type="button" class="btn" data-action="next-grammar">Siguiente oración →</button>':`<button type="submit" class="btn">Comprobar tiempo</button><button type="button" class="btn ghost" data-action="reveal-grammar">Ver explicación</button>`}</div></form></div>`;
if(grammarFeedback){inner+=`<div class="feedback show ${grammarFeedback.correct?'good':'bad'}" role="status"><strong>${grammarFeedback.correct?'¡Correcto! +12 XP':'No exactamente. Esta es la respuesta:'}</strong><p class="answer-key">${esc(c.tense.name)} · ${esc(forms[c.i])}</p><p><b>En español:</b> ${esc(c.es)}</p><p><b>Fórmula:</b> ${esc(c.tense.formula)}</p><p><b>¿Cómo lo reconocés?</b> ${esc(c.tense.clues[c.i])}</p><div class="memory"><b>Para acordarte:</b> ${esc(c.tense.tip)}</div></div>`}
return shell('Detective de tiempos','SESIÓN 02',inner,grammarAside())}
function libraryPage(){let inner=`<p class="desc">Tu hoja de referencia. Siempre están los mismos ejemplos de gramática y exactamente los verbos de la página 164 del libro.</p><div class="library-head"><div class="pills"><button class="pill ${libraryType==='verbs'?'active':''}" data-action="lib-verbs">70 verbos</button><button class="pill ${libraryType==='grammar'?'active':''}" data-action="lib-grammar">13 tiempos</button></div>${libraryType==='verbs'?`<input class="search" type="search" id="librarySearch" placeholder="Buscar por inglés o español..." value="${esc(libraryQuery)}" aria-label="Buscar verbo">`:''}</div>`;
if(libraryType==='verbs'){const rows=verbs.filter(v=>[v.v1,v.v2,v.v3,v.es,v.pat].some(x=>x.toLowerCase().includes(libraryQuery.toLowerCase())));inner+=`<div class="table-wrap"><table class="verb-table"><thead><tr><th>V1 · Infinitive</th><th>V2 · Past</th><th>V3 · Participle</th><th>Español</th></tr></thead><tbody>${rows.map(v=>`<tr><td><b>${esc(v.v1)}</b></td><td>${esc(v.v2)}</td><td>${esc(v.v3)}</td><td>${esc(v.es)}</td></tr>`).join('')}</tbody></table></div><div class="footnote">${rows.length} de ${verbs.length} verbos · Variantes británicas y estadounidenses cuando corresponda.</div>`}
else inner+=`<div class="lesson-grid">${tenses.map(t=>`<article class="ref-card"><strong>${esc(t.name)}</strong><small>${esc(t.group==='present'?'Presente':t.group==='past'?'Pasado':'Futuro')}</small><div class="formula">${esc(t.formula)}</div><ul>${t.forms.map((f,i)=>`<li><b>${['+','−','?'][i]}</b> ${esc(f)}</li>`).join('')}</ul><p style="color:#79748d;font-size:12px;margin-top:11px">${esc(t.tip)}</p></article>`).join('')}</div>`;
return shell('Biblioteca de repaso','MATERIAL FIJO',inner,`<div class="aside tip"><div class="meta">TU MANUAL</div><h3>Consultá sin adivinar</h3><p>La biblioteca no resta puntos. Está para mirar fórmulas, comparar columnas y estudiar tranquilo.</p></div><div class="aside"><h3>Truco V2 / V3</h3><p><b>I went</b> = fui (V2).<br><b>I have gone</b> = he ido (V3).</p><p style="margin-top:10px">La V3 se usa, por ejemplo, con <i>have</i>, <i>has</i> o <i>had</i> en los tiempos perfectos.</p></div>`)}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});document.getElementById('app').innerHTML=tab==='verbs'?verbPage():tab==='grammar'?grammarPage():libraryPage();renderStats()}
function variants(form,verb,slot){const vals=String(form).split('/').map(x=>x.trim().toLowerCase());if(verb.v1==='get'&&slot===2)vals.push('gotten');if(verb.v1==='be'&&slot===1){vals.push('was were','was/were','were/was')}return vals}
function norm(v){return String(v).toLowerCase().trim().replace(/\s+/g,' ').replace(/[’‘]/g,"'")}
function checkVerb(reveal=false){if(verbFeedback||!currentVerb)return;const v=currentVerb,formsNow=[v.v1,v.v2,v.v3],inputs=[...document.querySelectorAll('#verbForm [data-slot]')],values={};let all=true;for(const el of inputs){const slot=Number(el.dataset.slot),user=norm(el.value);values[slot]=el.value;if(!user||!variants(formsNow[slot],v,slot).some(x=>norm(x)===user))all=false;}if(!reveal&&inputs.some(el=>!el.value.trim())){toast('Completá las casillas vacías antes de corregir.');return}const correct=!reveal&&all;record('verb',v.v1,correct);verbFeedback={correct,values};render()}
function checkGrammar(reveal=false){if(grammarFeedback||!currentCard)return;const select=document.getElementById('tenseAnswer'),guess=select.value;if(!reveal&&!guess){toast('Elegí un tiempo verbal para corregir.');return}const correct=!reveal&&guess===currentCard.tense.id;record('grammar',currentCard.id,correct);grammarFeedback={correct,guess};render()}
let toastTimeout;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('visible'),2800)}
function say(text){if(!('speechSynthesis' in window)){toast('Este navegador no tiene voz integrada.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.83;window.speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;switch(a){case'next-verb':pickVerb();break;case'next-grammar':pickGrammar();break;case'reveal-verb':checkVerb(true);break;case'reveal-grammar':checkGrammar(true);break;case'say-verb':if(currentVerb)say(`${currentVerb.v1}. ${currentVerb.v2.replace('/',' or ')}. ${currentVerb.v3.replace('/',' or ')}.`);break;case'all-verbs':verbFilter='all';pickVerb();break;case'all-grammar':grammarFilter='all';grammarFormFilter='all';pickGrammar();break;case'lib-verbs':libraryType='verbs';render();break;case'lib-grammar':libraryType='grammar';render();break;case'reset':if(confirm('¿Querés reiniciar XP, racha, aciertos y errores? Esta acción no se puede deshacer.')){progress=JSON.parse(JSON.stringify(initial));persist();verbFeedback=grammarFeedback=null;render();toast('Progreso reiniciado.')}break;}});
document.addEventListener('change',e=>{const id=e.target.id,value=e.target.value;if(id==='verbMode'){verbMode=value;verbFeedback=null;singleSlot=Math.floor(Math.random()*3);render()}else if(id==='verbFilter'){verbFilter=value;currentVerb=null;pickVerb()}else if(id==='grammarFilter'){grammarFilter=value;currentCard=null;pickGrammar()}else if(id==='grammarFormFilter'){grammarFormFilter=value;currentCard=null;pickGrammar()}});
document.addEventListener('input',e=>{if(e.target.id==='librarySearch'){const pos=e.target.selectionStart;libraryQuery=e.target.value;render();const input=document.getElementById('librarySearch');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='verbForm'){e.preventDefault();checkVerb()}else if(e.target.id==='grammarForm'){e.preventDefault();checkGrammar()}});
// Verificación interna para que no se pierda ningún verbo ni ejemplo.
console.assert(verbs.length===70,'Se esperaban 70 verbos');console.assert(tenses.length===13&&grammarCards.length===39,'Se esperaban 39 oraciones');
render();
</script>
</body>
